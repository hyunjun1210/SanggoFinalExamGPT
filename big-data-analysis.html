<style>
:root {
  --accent:#a14460; --accent-strong:#902d4e; --accent-ink:#842341;
  --tint:#fae8ed; --tint-2:#fdf2f5; --side:#f8f2f4; --line:#ecdce2;
}
[data-theme=dark] {
  --accent:#f1acc1; --accent-strong:#efafc4; --accent-ink:#ffd0de;
  --tint:#4c2c39; --tint-2:#392631; --side:#271e26; --bg:#211a21;
  --surface:#2f2430; --soft:#392c3a; --line:#4d3a48; --ink:#f6eef5; --body:#eddae7; --muted:#c5aebf;
}
.brand-mark { background:linear-gradient(145deg,#b35e7a,#902d4e); box-shadow:0 4px 10px #902d4e30 }
.hero-art { display:grid; place-items:center }
.chart-preview {
  width:62%; height:56%; display:flex; align-items:flex-end; gap:7%; padding:12% 9% 8%;
  background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px) var(--surface);
  border:1px solid var(--line); border-radius:12px;
  box-shadow:9px 12px 0 color-mix(in srgb,var(--accent) 15%,transparent);
  transform:rotate(-8deg);
}
.chart-preview i { flex:1; height:var(--height); border-radius:5px 5px 0 0; background:var(--accent-strong); opacity:.8 }
.hint-table td:nth-child(3) { width:18%; white-space:normal }
@media(max-width:500px) {
  .hero-content { max-width:100% }
  .hero-art { opacity:.24 }
  .chart-preview { width:73% }
}
</style>
</head>

<script id="study-data">
const subject = {
  name:'빅데이터 분석', tagline:'시험 대비 노트', icon:'monitor',
  storage:'big-data-exam-study-v1', theme:'big-data-exam-theme',
  heroTitle:'빅데이터 분석<br><span>시험 대비</span>',
  heroArt:'<div class="chart-preview"><i style="--height:25%"></i><i style="--height:48%"></i><i style="--height:38%"></i><i style="--height:73%"></i><i style="--height:90%"></i></div>',
  lede:'시험 힌트 4쪽의 탐색적 분석, 모형 검증, 결과 시각화를 객관식 문제로 점검하세요.',
  flow:'힌트 문제 → 핵심 개념 → 확인 문제',
  introLabel:'힌트 문제', hintLabel:'힌트', hintColumn:'시험 힌트 · 핵심 답',
  hintsDescription:'시험 힌트 4쪽을 주제별로 정리했습니다. 항목을 누르면 개념과 확인 문제를 볼 수 있어요.'
};

const units = [
  {id:'exploration',title:'탐색적 데이터 분석',subtitle:'EDA · 기술 통계 · 표본 추출',icon:'search',color:'#a14460'},
  {id:'models',title:'분석 모형과 검증',subtitle:'K-means · ANOVA · 시뮬레이션',icon:'box',color:'#5264a5'},
  {id:'visualization',title:'데이터 시각화',subtitle:'차트 선택 · 구축 절차 · 분석 도구',icon:'monitor',color:'#267561'},
  {id:'visual-design',title:'시각화 설계 원칙',subtitle:'디자인 7원칙 · 시각 변수 · 그래픽 원칙',icon:'pen',color:'#95612e'}
];
const notes = [];
const hints = [];
const questions = [];

function topic(id, unit, title, pageNumber, sheet, terms, cue, quiz) {
  const page = '힌트지 ' + pageNumber + '쪽';
  notes.push({id,unit,title,page,sheet,terms,cue});
  hints.push([title,page,id,sheet[1]]);
  quiz.forEach(([prompt,correct,distractors,explanation],index) => {
    questions.push({
      id:id + '-' + (index + 1), noteId:id, prompt,
      options:[correct,...distractors], answer:0, explanation, type:'객관식'
    });
  });
}

  ['탐색적 데이터 분석(EDA)의 흐름은?', '데이터 수집 → 시각화 탐색 → 패턴 노출 → 인사이트 발견'], [

    ['가설과의 관계','가설 설정 전에 데이터를 이해한다. 탐색으로 결과 해석의 바탕이 되는 가정을 살피고 검토할 수도 있다.']
