<script id="study-data">
const subject = {
  name:'응용프로그래밍 화면구현', tagline:'시험 대비 노트', icon:'monitor',
  storage:'ui-exam-study-v1', theme:'ui-exam-theme',
  heroTitle:'응용프로그래밍<br>화면구현 <span>시험 대비</span>',
  heroArt:'<div class="wireframe-preview"><i></i><i></i><i></i></div>',
  lede:'시험 힌트에 나온 UI 디자인·구현·테스트의 핵심 개념을 익히고 연습 문제로 점검하세요.',
  flow:'힌트 문제 → 자세히 보기 → 확인 문제',
  introLabel:'힌트 문제', hintLabel:'힌트', hintColumn:'시험 힌트 · 핵심 답',
  hintsDescription:'사진에 나온 15개 주제와 교재 쪽수입니다. 주제를 누르면 해당 개념을 단계별로 학습합니다.'
};

const units = [
  {id:'design',title:'UI 디자인',subtitle:'사용자 중심 디자인 · 화면 표현',icon:'pen',color:'#256ca8'},
  {id:'implementation',title:'UI 구현',subtitle:'요구사항 · 설계 자료 · Camel 표기법',icon:'layout',color:'#267561'},
  {id:'testing',title:'UI 테스트',subtitle:'사용성 평가 · 결과 분석 · UI 개선',icon:'list',color:'#7356a7'}
];
const unitTitles = new Map(units.map(({id,title}) => [id,title]));
const notes = [];
const hints = [];
const questions = [];

function topic(id, unit, title, pages, sheet, terms, cue, quiz) {
  const page = unitTitles.get(unit) + ' ' + pages + '쪽';
  notes.push({id,unit,title,page,sheet,terms,cue});
  hints.push([title,page,id,sheet[1]]);
  quiz.forEach(([prompt,correct,distractors,explanation],index) => {
    const isOX = typeof correct === 'boolean';
    questions.push({
      id:id + '-' + (index + 1),noteId:id,prompt,
      options:isOX ? ['O','X'] : [correct,...distractors],
      answer:isOX && !correct ? 1 : 0,
      explanation,
      type:isOX ? 'O/X' : '객관식'
    });
  });
}

topic('user-centered', 'design', '사용자 중심 디자인', '3·7',
  ['사용자 중심 디자인의 근거는?', '실제 사용자의 경험을 조사해 니즈를 파악하고 디자인에 반영한다.'], [

    ['사용자 니즈','사용자가 필요로 하거나 원하는 것이다. 사용자를 이해할 때 중점적으로 파악한다.']
  ], '경험을 조사해서 니즈를 찾는다.', [
    ['사용자 중심 디자인에 가장 가까운 사례는?', '실제 이용자가 겪는 불편을 조사해 화면을 설계한다.', ['전문가 한 사람이 선호하는 화면을 그대로 채택한다.','화면을 완성하고 나서 사용자 경험을 고려하겠다고 선언한다.','개발자가 가장 만들기 쉬운 화면으로 결정한다.'], '실제 사용자의 경험을 조사하고 그 결과를 설계에 반영한다.'],
    ['사용자 니즈는 사용자가 필요로 하거나 원하는 것을 뜻한다.', true, null, '사용자 조사에서 니즈를 파악해 설계에 활용한다.']

topic('design-documents', 'design', '디자인 기획 문서', '7',

    ['비주얼 무드보드','페르소나의 라이프스타일을 반영해 정리한 이미지, 색 등 시각 자료다.'],

    ['비주얼 무드보드를 바탕으로 GUI 상세 디자인의 방향을 문서로 정리한 것은?', '콘셉트 기획서', ['페르소나','플로우차트','와이어 프레임'], '무드보드가 시각 자료를 모은 것이라면 콘셉트 기획서는 그 자료로 상세 디자인 방향을 정리한 문서다.']
