<style>
:root {
  --accent:#99611e; --accent-strong:#825016; --accent-ink:#75450f;
  --tint:#faedd9; --tint-2:#fbf4e9; --side:#f8f5ee; --line:#e8decf;
}
[data-theme=dark] {
  --accent:#e3b478; --accent-strong:#e3b478; --accent-ink:#f2c995;
  --tint:#483624; --tint-2:#352a20; --side:#241f1a; --bg:#201b17;
  --surface:#2d251e; --soft:#382d23; --line:#504234; --ink:#f4ede4; --body:#e7d7c6; --muted:#bdad9b;
}
.brand-mark { background:linear-gradient(145deg,#b9813c,#825016); box-shadow:0 4px 10px #82501630 }
.practice-modes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; max-width:780px; margin:16px 0 }
.practice-mode {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:15px;
  min-height:106px; padding:16px; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:13px; transition:border-color .15s,background .15s;
}
.practice-mode:hover { border-color:var(--accent); background:var(--soft) }
.practice-primary { background:var(--tint-2); border-color:color-mix(in srgb,var(--accent) 40%,var(--line)) }
.practice-count {
  display:grid; place-items:center; min-width:57px; height:54px; padding:0 8px; border-radius:9px;
  background:var(--tint); color:var(--accent-ink); font-size:27px; font-weight:800; font-variant-numeric:tabular-nums;
}
.practice-mode strong,.practice-mode small { display:block }
.practice-mode strong { font-size:17px }
.practice-mode small { color:var(--muted); font-size:12px }
.practice-mode > .icon { color:var(--accent-ink) }
.practice-links { display:flex; flex-wrap:wrap; gap:12px 23px; margin-top:21px }
.practice-resume { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; max-width:780px }
.practice-resume h2,.practice-glossary h2 { font-size:18px }
.practice-resume p { color:var(--muted); margin-top:4px; font-size:13px }
.practice-glossary { display:grid; gap:12px; max-width:780px; margin-bottom:18px }
.practice-glossary .panel { scroll-margin-top:80px }
.practice-glossary h2 { margin-bottom:10px }
.question-title strong { color:var(--accent-ink); font-weight:850 }
@media(max-width:640px) {
  .practice-modes { grid-template-columns:minmax(0,1fr) }
  .practice-mode { min-height:84px }
}
</style>
</head>

<script id="study-data">
const subject = {
  name:'자재 출고 관리', tagline:'객관식 연습', icon:'box',
  storage:'materials-exam-study-v1', theme:'materials-exam-theme',
  lede:'시험지 40문제를 풀고, 제출하면 채점과 짧은 해설을 볼 수 있어요.',
  practice:{
    mockCount:25,
    glossary:[
      {id:'dispatch-terms',title:'출고 용어',terms:[
        ['일괄 출고','여러 부품을 조립에 쓸 수 있게 한꺼번에 내보내는 방식.'],
        ['현물 대체 · 입고 수량 상계','현물 대체는 자재를 다른 실물로 보충하는 것. 상계는 처리할 수량을 입고 수량에서 빼서 맞추는 것. 자재를 돌려보내는지(반품), 폐기하는지(미반품)와 조합해 유형을 구분한다.'],
        ['선입선출','먼저 들어온 자재를 먼저 내보내는 원칙.'],
        ['이상 발생','규격·수량이 요청과 다르거나 파손·불량이 있으면 출고를 보류하고 담당자에게 확인한다. 발견 내용과 처리 과정은 기록한다.']
      ]},
      {id:'inspection-transport',title:'검사·운반 용어',terms:[
        ['치수 검사','길이·두께·지름·높이 같은 크기를 잰다. 동작 여부는 성능을 보는 항목이다.'],
        ['샘플링 검사','전체 자재 중 일부를 표본으로 뽑아 검사하는 방식.'],
        ['계수의 용이성','용기에 담긴 자재의 개수를 쉽게 셀 수 있다는 뜻.'],
        ['운반 합리화 원칙','활성화는 바로 움직일 수 있게 받침대나 대차에 두기, 단위 화물은 운반 도구 하나에 한 종류만 싣기, 재취급 방지는 옮기고 다시 쌓는 일을 줄이기, 트레일러는 적재한 트레일러째 공급하기.']
      ]},
      {id:'calculations',title:'계산 공식',terms:[
        ['자재 소요량','제품 1개당 필요한 자재 수 × 생산할 제품 수. 7번은 3 × 200 = 600개, 25번은 5 × 60 = 300개.'],
        ['부피','가로 × 세로 × 높이. 세 변이 50cm, 50cm, 80cm라면 부피는 200,000cm³.']
      ]}
    ]
  }
};

const units = [
  {id:'plan',title:'출고 계획'},
  {id:'inspection',title:'출고 검사'},
  {id:'exceptions',title:'이상 발생 처리'},
  {id:'amount',title:'공정별 종류·수량'},
  {id:'method',title:'형태별 출고 방법'},
  {id:'size',title:'형상·크기별 출고 방법'}
];
const notes = [];
const hints = [];
const questions = [];

function question(number, unit, prompt, options, answer, explanation, glossary) {
  questions.push({
    id:'materials-' + number, number, unit, prompt, options,
    answer:answer - 1, explanation, glossary, type:'객관식'
  });
}

question(1,'plan','소요 자재 출고 계획을 세우는 주된 목적은?',[
  '자재 구매 가격을 높이기','자재 입고 기록을 최소화하기','자재 종류를 최소화하기','창고 출고량을 최대화하기','생산에 필요한 자재를 필요한 수량만큼 공급하기'
],5,'생산 일정에 맞춰 필요한 자재를 필요한 수량만큼 공급하는 것이 목적이다.');

question(2,'plan','소요 자재 출고 계획을 세울 때 무엇을 고려해야 하나?',[
  '보관 위치와 관계없이 같은 순서로 출고','생산 계획과 관계없이 일괄 출고','가격과 구매처만 고려','창고 공간을 비우기 위해 일정 없이 출고','생산 계획과 자재 소요량'
],5,'생산 계획을 기준으로 언제 어떤 자재가 얼마나 필요한지 파악한다.');

question(3,'plan','생산 계획에 따라 필요한 자재의 종류와 수량을 파악하는 일은?',[
  '자재 폐기','제품 광고','거래처 평가','자재 소요량 산정','판매 가격 결정'
],4,'소요량 산정은 생산에 필요한 자재 종류와 수량을 계산하는 일이다.','calculations');

question(4,'plan','제품 조립에 필요한 여러 부품을 한꺼번에 출고하는 방식은?',[
  '납품용 출고','일괄 출고','개별 출고','부품 출고','현장 출고'

question(5,'plan','반품의 유형에 해당하지 <strong>않는</strong> 것은?',[
  '반품 후 폐기 대체','반품 후 현물 대체','반품 후 입고 수량 상계','미반품(폐기) 현물 대체','미반품(폐기) 입고 수량 상계'
],1,'반품 여부를 먼저 구분하고, 현물 대체 또는 입고 수량 상계로 처리한다.','dispatch-terms');

question(6,'plan','일반적인 출고 분류에서 기타 출고에 해당하지 <strong>않는</strong> 것은?',[
  '생산 출고','샘플 출고','폐기 출고','시험 출고','서비스 부품 출고'
],1,'업종별 업무 프로세스 표준모델은 샘플·폐기·시험·서비스 부품 출고를 기타 출고로 분류한다. 첨부 사진에는 ③에 표시가 있어 학교 정답표 확인이 필요하다. <a class="text-link" href="https://www.scribd.com/document/616128513/%EC%97%85%EC%A2%85%EB%B3%84-%EC%97%85%EB%AC%B4-%ED%94%84%EB%A1%9C%EC%84%B8%EC%8A%A4-%ED%91%9C%EC%A4%80%EB%AA%A8%EB%8D%B8-%EC%A0%9C1%EC%B0%A8%EA%B8%88%EC%86%8D%EC%82%B0%EC%97%85" target="_blank" rel="noopener noreferrer">표준모델 38쪽</a>');

question(7,'plan','제품 1개에 자재 3개가 든다. 제품 200개를 만들 때 자재는 몇 개 필요한가?',[

question(14,'inspection','샘플링 검사에 대한 설명으로 알맞은 것은?',[
