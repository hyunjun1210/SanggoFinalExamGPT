:root {

.brand-mark { background:linear-gradient(145deg,#7c9148,#4c6025); box-shadow:0 4px 10px #4c602530 }
.hero-art { display:grid; place-items:center }
.career-case {
  position:relative; display:grid; place-items:center;
  width:64%; height:46%; border:1px solid var(--accent); border-radius:12%;
  background:linear-gradient(var(--tint) 47%,var(--accent) 48% 49%,var(--surface) 50%);
  box-shadow:10px 12px 0 color-mix(in srgb,var(--accent) 18%,transparent);
  transform:rotate(-10deg);
}
.career-case::before {
  content:''; position:absolute; bottom:100%; width:31%; height:23%;
  border:4px solid var(--accent); border-bottom:0; border-radius:8px 8px 0 0;
}
.career-case::after {
  content:''; width:18%; height:21%; background:var(--accent-strong); border-radius:4px;
}
.safety-sign {
  position:relative; display:inline-grid; place-items:center; flex:none;
  width:42px; height:42px; margin-inline-end:7px; vertical-align:middle;
  color:#161713; line-height:1; font:700 25px/1 'Segoe UI Symbol',sans-serif;
}
.safety-sign.stop { background:#fff; border:4px solid #b2272d; border-radius:50% }
.safety-sign.stop::after {
  content:''; position:absolute; width:100%; height:4px; background:#b2272d; transform:rotate(45deg);
}
.safety-sign.warn {
  background:#161713; height:39px; padding-top:9px;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.safety-sign.warn::before {
  content:''; position:absolute; inset:4px 4px 3px; background:#ffd651;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.safety-sign > span { position:relative }
.safety-sign .radiation-mark { font-size:17px; margin-top:5px }
.radiation-mark small { position:absolute; inset:auto 0 91%; font-size:9px }
.safety-sign.mandatory { background:#1b458a; color:#fff; border-radius:50% }
.safety-sign .helmet {
  width:25px; height:16px; background:currentColor; border-radius:13px 13px 4px 4px;
}
.safety-sign .helmet::after {
  content:''; position:absolute; width:29px; height:3px; left:-2px; bottom:0; background:currentColor; border-radius:2px;
}
.safety-sign .walker {
  width:17px; height:25px; background:currentColor;
  clip-path:polygon(52% 0,71% 3%,75% 14%,63% 24%,73% 35%,89% 49%,81% 59%,60% 43%,52% 59%,69% 68%,80% 96%,64% 100%,54% 78%,39% 69%,25% 94%,7% 100%,4% 89%,17% 82%,32% 57%,39% 35%,30% 38%,21% 52%,9% 46%,20% 28%,37% 22%,45% 22%,43% 10%);
}
.safety-sign .slip { transform:rotate(-39deg) scale(.82) }
@media(max-width:500px) {
  .hero-content { max-width:100% }
  .hero-art { opacity:.24 }
}

const notes = [];

function topic(id, unit, title, pageNumber, sheet, terms, cue, quiz, source) {
  const page = '교과서 ' + pageNumber + '쪽';
  notes.push({id,unit,title,page,sheet,terms,cue,source});

    questions.push({
      id:id + '-' + (index + 1), noteId:id, prompt,
      options:[correct,...distractors], answer:0, explanation, type:'객관식'
    });
  });
}

  ['성장의 늪을 만난 기업은 혁신의 변곡점에서 어떻게 갈라지는가?', '재혁신을 하면 재도약할 수 있고, 정체가 이어지면 도태될 수 있다.'], [
    ['그림의 축과 진행','세로축은 매출, 가로축은 기업의 연혁이다. 그림에서는 초기 혁신으로 매출이 성장하다가 12년 무렵부터 정체하고, 20년 지점에서 혁신의 변곡점을 표시한다.'],
    ['혁신의 변곡점','기업가정신을 발휘해 재혁신하면 재도약하는 위쪽 경로로 갈 수 있다. 재혁신에 실패하면 도태되는 아래쪽 경로로 갈 수 있다.']
  ], '혁신·성장 → 정체 → 혁신의 변곡점 → 재도약 또는 도태.', [
    ['교과서의 성장 그래프에서 정체기를 거친 기업이 다시 도약하는 경로의 핵심은?', '기업가정신을 발휘한 재혁신', ['사업을 유지하면서 투자와 혁신을 중단함','성장의 늪에서 매출 정체를 그대로 둠','초기 혁신과 같은 매출 수준을 유지함'], '정체기에도 새로운 변화와 혁신을 추구하면 기업은 다시 성장할 수 있다.'],
    ['기업가정신의 역할을 그린 그래프의 흐름을 바르게 읽은 것은?', '초기 혁신으로 성장 → 성장의 늪에서 정체 → 변곡점 뒤 재도약 또는 도태', ['정체 → 도태 → 성장 → 변곡점','초기 혁신으로 성장 → 도태 → 정체','재도약 → 성장의 늪 → 초기 혁신 → 변곡점'], '초기 성장이 정체로 이어지고, 변곡점 이후 두 경로가 나타난다.']
  ]);

topic('labor-law-types', 'labor', '근로관계 법의 개념과 종류', 167,
  ['개별적 근로관계 법과 집단적 근로관계 법은 어떻게 구분하는가?', '개별은 근로자 개인의 근로조건 보호 / 집단은 노동조합 등 근로자 단체와 사용자의 관계'], [
    ['근로관계 법','근로자와 사용자의 권익을 보호하기 위해 두 당사자의 관계를 규정하는 법을 말한다.'],
    ['개별적 근로관계 법','근로자 개인과 사용자 사이의 관계에서 근로조건 등을 국가가 보호한다. 예로 근로기준법, 최저임금법, 근로복지기본법, 산업재해보상보험법, 고용보험법, 기간제 및 단시간근로자 보호 등에 관한 법률이 있다.'],
    ['집단적 근로관계 법','근로자가 자주적으로 단체를 만들고 사용자와 대등하게 교섭하는 관계를 다룬다. 예로 노동조합 및 노동관계조정법, 노동위원회법, 노사관계 발전 지원에 관한 법률이 있다.']
  ], '개인 근로계약은 개별적, 노동조합과 사용자의 관계는 집단적.', [
    ['노동조합의 활동과 사용자와의 단체교섭을 다루는 법 유형은?', '집단적 근로관계 법', ['개별적 근로관계 법','근로자 개인의 취업 규칙','개인 근로계약'], '노동조합 등 집단과 사용자 사이의 관계를 다룬다.'],
    ['개별적 근로관계 법과 집단적 근로관계 법의 예를 순서대로 맞게 연결한 것은?', '근로기준법 — 노동조합 및 노동관계조정법', ['노동위원회법 — 최저임금법','최저임금법 — 고용보험법','노동조합 및 노동관계조정법 — 근로기준법'], '근로기준법은 개인의 근로조건을, 노동조합 및 노동관계조정법은 집단 관계를 다룬다.']
  ]);

topic('work-rules', 'labor', '취업 규칙', 170,
  ['사용자가 사업장의 근로조건과 복무 규율을 정한 공통 규칙은?', '취업 규칙'], [
    ['취업 규칙','사용자가 사업장에서 공통으로 적용할 근로조건과 복무 규율 등을 정한 규칙이다. 근로자 개인과 사용자의 근로관계에 적용된다.']
  ], '사용자가 정한 사업장 공통 규칙.', [
    ['사업장의 근무 질서와 근로조건을 공통으로 적용하기 위해 사용자가 정하는 것은?', '취업 규칙', ['단체협약','개별 근로계약서','근로자 명부'], '취업 규칙은 사업장의 근로조건과 복무 규율을 정한 공통 규칙이다.'],
    ['취업 규칙의 의미에 가장 가까운 것은?', '사업장 근로자에게 공통으로 적용되는 근로조건과 복무 규율', ['한 근로자가 사용자와 합의한 개인별 계약 조건','노동조합과 사용자가 교섭해 체결한 협약','재취업 희망자가 작성한 구직 신청서'], '개인별 계약이나 단체협약과 구별되는 사업장 공통 기준이다.']
  ]);

topic('contract-checks', 'labor', '근로계약 체결 시 유의할 점', 172,
  ['근로계약을 맺을 때 적어야 할 조건과 금지되는 약정은?', '임금·소정근로시간·휴일·연차 명시 및 서면 교부 / 위약금 예정·전차금 상계·강제 저축 금지'], [
    ['작성·교부와 기준','근로계약서에 임금, 소정근로시간, 휴일, 연차 유급휴가 등 근로조건을 명시하고 근로자에게 교부한다. 법이 정한 최저기준을 지킨다.'],
    ['위약금 또는 손해배상액 예정 금지','계약을 지키지 못했을 때 낼 위약금이나 손해배상액을 미리 정할 수 없다.'],
    ['전차금 상계·강제 저축 금지','근로를 조건으로 빌려준 돈 등을 임금에서 상계할 수 없다. 근로계약에 강제 저축을 묶을 수 없다.']
  ], '근로조건은 문서로 명시하고, 위약금 예정·전차금 상계·강제 저축은 금지.', [
    ['근로계약 체결 시 교과서의 유의 사항을 지킨 사례는?', '임금·소정근로시간·휴일·연차 유급휴가를 명시해 근로자에게 교부했다.', ['퇴사 시 납부할 위약금을 미리 정했다.','근로를 조건으로 빌려준 돈을 임금에서 빼기로 했다.','일정액을 매월 강제로 저축하도록 계약했다.'], '근로조건을 명시해 교부하고, 위약금 예정·전차금 상계·강제 저축 조항은 두지 않는다.'],
    ['계약 기간을 채우지 못하면 100만 원을 내도록 미리 약정한 것은 무엇에 해당하는가?', '위약금 예정', ['서류의 보존','전차금 상계','법정 근로조건 명시'], '근로계약 불이행 때 낼 금액을 사전에 정하는 위약금 예정이다.']
  ], {url:'https://www.law.go.kr/lsInfoP.do?joNo=001500&lsId=001872',label:'근로기준법 제15조·제17조·제20~22조'});

topic('annual-leave', 'labor', '연차 유급휴가', 172,
  ['그림에서 1년간 80% 이상 출근하면 연차 유급휴가는 며칠인가?', '15일'], [
    ['출근 기준과 일수','1년 동안 출근율이 80% 이상인 근로자에게 연차 유급휴가 15일이 주어진다. 교과서 175쪽의 설명과 함께 기억한다.']
  ], '1년 · 80% 이상 출근 · 15일.', [
    ['1년간 80% 이상 출근한 근로자의 기본 연차 유급휴가 일수는?', '15일', ['10일','20일','25일'], '시험 그림에서 연결해야 하는 숫자는 출근율 80% 이상과 연차 15일이다.'],
    ['1년간 출근율을 기준으로 연차 유급휴가 15일이 주어지는 조건은?', '출근율이 80% 이상일 때', ['출근율이 60% 이상일 때','출근율이 70% 이상일 때','출근율이 반드시 100%일 때'], '1년간 80% 이상 출근이 15일의 기준이므로 정확히 80%도 포함한다.']
  ], {url:'https://www.law.go.kr/LSW/lsInfoP.do?ancYnChk=0&chrClsCd=010202&efYd=20261008&joNo=0060&lsiSeq=285279&urlMode=lsInfoP',label:'근로기준법 제60조'});

topic('contract-records', 'labor', '근로계약서 작성과 서류 보존', 174,
  ['근로계약서는 누구에게 주고, 관련 서류는 몇 년 보존하는가?', '근로자에게 교부 / 근로자 명부와 주요 계약 서류는 3년 보존'], [
    ['근로계약서 작성','사용자가 근로계약서를 작성하고 근로자에게 교부한다.'],
    ['서류의 보존','사용자가 근로자 명부, 근로계약서, 임금대장 등 주요 서류를 3년간 보존한다.']
  ], '작성·교부는 근로계약서, 3년 보존은 사용자.', [
    ['근로자 명부와 근로계약서·임금대장 등 주요 서류의 보존 기간으로 맞는 것은?', '3년', ['1년','2년','5년'], '교과서는 사용자가 주요 계약 서류를 3년 동안 보존해야 한다고 설명한다.'],
    ['근로계약서 작성 및 보존에 관한 설명으로 알맞은 것은?', '사용자가 근로계약서를 작성하고 근로자에게 교부한다.', ['계약서를 구두로 설명하면 사용자만 보관해도 된다.','근로자가 임금대장과 근로자 명부를 보존한다.','근로계약이 끝나는 날 근로계약서를 바로 폐기한다.'], '계약서를 작성하고 교부하는 일과 주요 계약 서류를 보존하는 일은 사용자 의무다.']
  ]);

topic('dismissal', 'labor', '해고와 예고', 175,
  ['교과서에서 해고 시 알려야 하는 내용과 예고 기한은?', '정당한 해고 사유와 시기 서면 통지 / 적어도 30일 전에 예고, 미예고 시 30일분 통상임금'], [
    ['해고','사용자가 근로자의 의사와 관계없이 근로관계를 종료하는 것을 말한다.'],
    ['교과서 문장','정당한 해고 사유와 시기를 서면으로 알리고, 적어도 30일 전에 예고하지 않으면 30일분의 통상임금을 지급한다고 설명한다.'],
    ['해고 예고와 서면 통지','근로기준법 제26조의 예고 기준은 30일 전 또는 통상임금 30일분 이상 지급이다. 제27조는 해고 사유와 시기를 서면으로 알리도록 규정한다.']
  ], '서면에 사유·시기. 예고는 30일 전. 미예고 시 30일분 통상임금.', [
    ['해고를 서면으로 통지할 때 교과서에서 명시하라고 한 사항은?', '해고 사유와 해고 시기', ['최근 임금과 근속연수','상시 근로자 수와 휴일 수','취업 규칙과 연차 사용 내역'], '해고 사유와 해고 날짜를 서면에 명시한다.'],
    ['교과서가 설명하는 해고 예고의 원칙으로 맞는 것은?', '적어도 30일 전에 예고하고, 기한을 지키지 않으면 30일분의 통상임금을 지급한다.', ['7일 전에 예고하고, 기한을 지키지 않으면 7일분의 통상임금을 지급한다.','30일 전에 예고하고, 기한을 지키지 않으면 15일분의 통상임금을 지급한다.','해고 당일 사유를 말로 알리면 예고를 한 것으로 본다.'], '시험에서 잡을 숫자는 30일 전 예고와 30일분 통상임금이다.']
  ], {url:'https://www.law.go.kr/lsInfoP.do?joNo=001500&lsId=001872',label:'근로기준법 제23조·제26조·제27조'});

topic('discrimination', 'labor', '차별 시정 제도의 뜻', 176,
  ['기간제·단시간·파견 근로자가 부당한 차별을 받았다면 어떤 제도를 이용하는가?', '차별 시정 제도 / 합리적 이유 없는 불리한 처우를 노동위원회에서 시정'], [
    ['차별적 처우','비교할 수 있는 근로자에 비해 임금, 근로조건, 복리후생 등에서 합리적 이유 없이 불리하게 대우하는 것이다.'],
    ['차별 시정 대상과 신청','기간제·단시간·파견 근로자는 노동위원회에 시정을 신청할 수 있다. 차별이 있은 날, 계속된 차별이라면 끝난 날부터 6개월 이내다.'],
    ['판단 기준','비교 대상과 업무 내용, 권한, 책임 등이 어떻게 다른지 살펴 불리한 처우에 합리적 이유가 있는지 판단한다.']
  ], '합리적 이유 없는 불리한 처우 → 노동위원회에 시정 신청.', [
    ['차별 시정 제도가 다루는 차별적 처우의 사례는?', '비교 가능한 근로자가 같은 일을 하는데 합리적 이유 없이 기간제 근로자의 수당을 낮췄다.', ['업무와 책임이 실제로 다른 점을 반영해 직책 수당을 정했다.','같은 업무를 맡은 근로자에게 같은 기준으로 성과급을 줬다.','같은 근로시간을 일한 근로자에게 같은 수당을 지급했다.'], '비교 대상에 비해 합리적 이유 없이 불리한 처우를 했는지가 핵심이다.'],
    ['기간제·단시간·파견 근로자가 합리적 이유 없는 차별을 받은 경우 시정을 신청하는 곳은?', '노동위원회', ['국세청','고용보험심사위원회','근로복지공단'], '교과서의 차별 시정 제도에서는 노동위원회에 시정을 신청한다.']
  ], {url:'https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000211116&chrClsCd=010201',label:'노동위원회규칙 제102조'});

topic('employment-services', 'employment', '고용서비스의 의미', 181,
  ['고용서비스는 구직자와 기업에 무엇을 제공하는가?', '구인·구직 정보, 직업 소개와 지도 등을 제공해 일자리와 인재를 연결한다.'], [
    ['고용서비스','공공 또는 민간 기관이 구인·구직 정보를 제공하고 직업을 소개하거나 진로·취업을 지도하는 서비스다.'],

topic('prevention-principles', 'safety', '재해 예방의 네 가지 원칙', 197,
  ['손실 우연과 원인 계기의 원칙은 각각 무엇을 뜻하는가?', '손실의 크기는 사고 조건에 따라 달라진다 / 사고는 필연적으로 원인이 있어 발생한다.'], [
    ['예방 가능의 원칙','자연재해를 제외한 인재는 예방할 수 있다고 본다. 사고가 발생하기 전에 예방한다.'],
    ['손실 우연의 원칙','사고가 비슷해도 발생 조건에 따라 손실의 정도는 다를 수 있다. 손실이 작더라도 사고 자체를 예방한다.'],
    ['원인 계기의 원칙','손실의 정도에는 우연이 작용할 수 있지만, 사고 자체에는 원인이 있다.'],
    ['대책 선정의 원칙','기술적 대책(Engineering), 교육적 대책(Education), 관리적 대책(Enforcement)의 3E를 함께 적용한다.']
  ], '사고에는 원인, 피해 크기에는 우연. 대책은 기술·교육·관리 3E.', [
    ['비슷한 사고가 두 번 발생했으나 한 번은 부상이 없었고 다른 한 번은 큰 부상이 있었다. 결과의 차이를 설명하는 원칙은?', '손실 우연의 원칙', ['원인 계기의 원칙','대책 선정의 원칙','예방 가능의 원칙'], '사고 결과의 손실 정도는 발생 당시 조건에 따라 달라질 수 있다.'],
    ['사고는 원인 없이 일어나지 않으므로 사고가 난 이유를 찾아야 한다는 원칙은?', '원인 계기의 원칙', ['손실 우연의 원칙','예방 가능의 원칙','대책 선정의 원칙'], '손실 크기의 우연성과 별개로 사고 발생의 원인은 존재한다.']
  ]);

topic('industrial-insurance', 'safety', '산업재해보상보험의 보험급여', 202,
  ['교과서가 표시한 네 가지 산재보험 급여는 무엇을 보상하는가?', '요양은 치료 / 휴업은 치료로 취업하지 못한 기간 / 장해는 치유 후 남은 장해 / 유족은 업무상 사망'], [
    ['요양급여','업무상 부상 또는 질병을 치료하는 데 필요한 급여다.'],
    ['휴업급여','업무상 부상이나 질병을 요양하느라 취업하지 못한 기간에 대한 급여다.'],
    ['장해급여','업무상 부상이나 질병이 치유된 후에도 장해가 남은 경우 지급한다.'],
    ['유족급여','근로자가 업무상 사유로 사망한 경우 유족에게 지급한다.']
  ], '치료 중 일하지 못하면 휴업, 치료가 끝난 뒤 장해가 남으면 장해.', [
    ['업무상 부상으로 치료받느라 일을 하지 못한 기간을 보상하는 산재보험 급여는?', '휴업급여', ['요양급여','장해급여','유족급여'], '요양급여는 치료를 위한 급여이고, 휴업급여는 요양 기간 중 일하지 못한 기간을 보상한다.'],
    ['산재보험 급여의 연결이 바른 것은?', '장해급여 — 치유 뒤 장해가 남은 경우 / 유족급여 — 업무상 사망에 따른 유족 지원', ['요양급여 — 취업하지 못한 기간 / 휴업급여 — 업무상 부상 치료','장해급여 — 업무상 사망에 따른 유족 지원 / 유족급여 — 치유 뒤 장해가 남은 경우','요양급여 — 치유 뒤 장해가 남은 경우 / 유족급여 — 업무상 부상 치료'], '치유 후 장해는 장해급여, 근로자가 업무상 사망하면 유족에게 유족급여를 지급한다.']
  ], {url:'https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1026601025',label:'산업재해보상보험법 제36조'});

topic('labor-rights', 'relations', '노사관계의 기본 구조와 노동 3권', 206,
  ['노사관계의 기본 구조에서 근로자의 노동 3권과 사용자의 권리는?', '근로자는 단결권·단체교섭권·단체행동권 / 사용자는 경영권'], [
    ['노사관계 기본 구조','근로자는 근로를 제공하고 기업의 성장을 위해 협력한다. 사용자는 임금을 지급하고 근로조건을 유지·개선한다. 그림에서 근로자의 노동 3권과 사용자의 경영권이 대응한다.'],
    ['단결권','근로조건을 유지·개선하기 위해 근로자가 단체를 결성하거나 가입할 수 있는 권리다.'],
    ['단체교섭권','노동조합 대표가 근로조건이나 단체협약 체결에 관해 사용자와 교섭할 수 있는 권리다.'],
    ['단체행동권','근로조건을 유지·개선하기 위해 근로자가 함께 단체행동을 할 수 있는 권리다.']
  ], '결성·가입은 단결권, 조건 협상은 단체교섭권, 집단행동은 단체행동권.', [
    ['노동조합 결성, 근로조건 협상, 근로조건 개선을 위한 집단행동에 해당하는 권리를 순서대로 나열한 것은?', '단결권 → 단체교섭권 → 단체행동권', ['단결권 → 단체행동권 → 단체교섭권','단체교섭권 → 단결권 → 단체행동권','단체행동권 → 단체교섭권 → 단결권'], '단체를 결성하는 것은 단결권, 대표가 근로조건을 협상하는 것은 단체교섭권, 함께 행동하는 것은 단체행동권이다.'],
    ['노사관계 기본 구조를 옳게 설명한 것은?', '근로자는 근로를 제공하고 노동 3권을 가진다. 사용자는 임금을 지급하고 경영권을 가진다.', ['근로자는 경영권을 가지고 사용자는 단체행동권을 행사한다.','근로자가 임금을 지급하고 사용자가 근로를 제공한다.','사용자가 노동조합을 결성하고 근로자는 회사의 근로조건만 결정한다.'], '기본 구조 그림에서 근로 제공과 노동 3권은 근로자 쪽이며, 임금 제공과 경영권은 사용자 쪽이다.']
  ], {url:'https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1011505399',label:'대한민국헌법 제33조'});
